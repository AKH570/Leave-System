{% extends 'base/base.html' %}{% block content %}<div class="container py-4"><h1>Roles</h1>{% include 'access/_nav.html' %}<a class="btn btn-primary mb-3" href="{% url 'accounts:access_role_add' %}">Create role</a><div class="list-group">{% for role in roles %}<a class="list-group-item list-group-item-action" href="{% url 'accounts:access_role_edit' role.pk %}"><strong>{{ role.name }}</strong><span class="float-end">{{ role.permissions.count }} permissions</span></a>{% empty %}<p>No roles yet.</p>{% endfor %}</div></div>{% endblock %}
